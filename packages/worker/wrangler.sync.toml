name = "bangumi-tv-sync"
main = "src/sync-worker.ts"
compatibility_date = "2026-06-17"

[vars]
SYNC_MODE = "merge"

[[kv_namespaces]]
binding = "BANGUMI_KV"
id = "bangumi-tv-kv"

[[r2_buckets]]
binding = "BANGUMI_R2"
bucket_name = "bangumi-tv-images"

[[durable_objects.bindings]]
name = "SYNCLOCK"
class_name = "SyncLock"

[[migrations]]
tag = "v1-sync-lock"
new_sqlite_classes = ["SyncLock"]
