<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BangumiTV - 多账户同步</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #1a1a2e; color: #e0e0e0; min-height: 100vh; display: flex; justify-content: center; padding: 40px 20px; }
    .container { max-width: 800px; width: 100%; }
    h1 { text-align: center; margin-bottom: 32px; color: #fff; }
    .step { background: #16213e; border-radius: 12px; padding: 24px; margin-bottom: 16px; display: none; }
    .step.active { display: block; }
    label { display: block; margin-bottom: 8px; color: #a0a0b0; }
    input[type="text"], input[type="password"] { width: 100%; padding: 12px; border: 1px solid #2a2a4a; border-radius: 8px; background: #0f3460; color: #fff; font-size: 16px; margin-bottom: 16px; }
    input[type="text"]:focus, input[type="password"]:focus { outline: none; border-color: #e94560; }
    button { padding: 12px 24px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; background: #e94560; color: #fff; margin-right: 8px; }
    button:disabled, input:disabled, select:disabled { opacity: 0.5; cursor: not-allowed; }
    button.secondary { background: #0f3460; }
    .diff-item { display: flex; align-items: flex-start; gap: 12px; padding: 12px; border-bottom: 1px solid #2a2a4a; }
    .diff-info { flex: 1; }
    .diff-info h3 { font-size: 14px; margin-bottom: 4px; }
    .diff-info p { font-size: 12px; color: #a0a0b0; }
    .progress { margin-top: 16px; }
    .progress-bar { height: 8px; background: #2a2a4a; border-radius: 4px; overflow: hidden; }
    .progress-fill { height: 100%; background: #e94560; transition: width 0.3s; }
    select { padding: 8px 12px; border-radius: 6px; background: #0f3460; color: #fff; border: 1px solid #2a2a4a; }
    .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .summary-card { background: #0f3460; border-radius: 8px; padding: 16px; text-align: center; }
    .summary-card .count { font-size: 28px; font-weight: bold; color: #e94560; }
    .summary-card .label { font-size: 12px; color: #a0a0b0; margin-top: 4px; }
    .panel { background: #16213e; border-radius: 12px; padding: 24px; margin-bottom: 24px; border: 1px solid #2a2a4a; }
    .muted { color: #a0a0b0; }
    .error-box { background: #2a1a1a; border: 1px solid #e94560; border-radius: 8px; padding: 12px; }
    .error-box strong { color: #e94560; display: block; margin-bottom: 8px; }
    .error-box p { color: #ffaaaa; }
    .status-ok { color: #4caf50; }
    .button-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .button-row button { margin-right: 0; }
    .token-row { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 16px; }
    .token-row input { flex: 1; min-width: 200px; margin-bottom: 0; }
  </style>
</head>
<body>
<div class="container">
  <h1>BangumiTV 多账户同步</h1>

  <div class="step active" id="step1">
    <h2>步骤 1: 输入 bgm.tv Access Token</h2>
    <p class="muted" style="margin-bottom:12px;">在 <a href="https://bgm.tv/dev" target="_blank" style="color:#e94560;">bgm.tv 开发者设置</a> 分别生成两个账号的 access token（永久有效），粘贴到下方。</p>

    <label>账号 A Access Token <span style="color:#e94560;">*</span></label>
    <input type="password" id="tokenA" placeholder="粘贴账号 A 的 Access Token">

    <label>账号 B Access Token <span style="color:#e94560;">*</span></label>
    <input type="password" id="tokenB" placeholder="粘贴账号 B 的 Access Token">

    <button id="start-compare">下一步：对比收藏</button>
    <div id="step1-status" class="muted" style="margin-top:12px;"></div>
  </div>

  <div class="step" id="step2">
    <h2>步骤 2: 对比结果 & 同步</h2>
    <div class="summary" id="step2-summary"></div>
    <div id="step2-diffs"></div>
    <div id="step2-sync" style="display:none;margin-top:20px;">
      <label>同步方向</label>
      <select id="sync-direction"></select>
      <div class="button-row" style="margin-top:12px;">
        <button id="full-sync">完整同步</button>
        <button id="partial-sync-toggle" class="secondary">按选中条目同步</button>
        <button id="partial-sync-start" style="display:none;">执行选中条目同步</button>
      </div>
      <div class="progress" id="sync-progress" style="display:none;">
        <div class="progress-bar"><div class="progress-fill" id="sync-progress-fill"></div></div>
        <p id="sync-progress-text" class="muted" style="margin-top:8px;"></p>
      </div>
    </div>
  </div>

  <div style="text-align:center;margin-top:24px;">
    <button id="reset-button" class="secondary">重新开始</button>
  </div>
</div>

<script>
let state = { tokenA: '', tokenB: '', differences: [] }

// ── DOM refs ──
const step1 = document.getElementById('step1')
const step2 = document.getElementById('step2')
const step1Status = document.getElementById('step1-status')
const step2Summary = document.getElementById('step2-summary')
const step2Diffs = document.getElementById('step2-diffs')
const syncProgress = document.getElementById('sync-progress')
const syncProgressFill = document.getElementById('sync-progress-fill')
const syncProgressText = document.getElementById('sync-progress-text')

// ── Helpers ──
function clear(node) { while (node.firstChild) node.removeChild(node.firstChild) }
function textElement(tag, text, className) {
  const el = document.createElement(tag)
  el.textContent = text
  if (className) el.className = className
  return el
}
function showError(target, data, fallback) {
  const msg = data?.error?.message || fallback
  clear(target)
  target.appendChild(textElement('p', msg, 'error-box'))
}
function showText(target, text, className = 'muted') {
  clear(target)
  target.appendChild(textElement('p', text, className))
}
async function apiFetch(url, opts = {}) {
  try {
    return await fetch(url, opts)
  } catch { return null }
}

// ── Compare ──
document.getElementById('start-compare').addEventListener('click', async () => {
  const ta = document.getElementById('tokenA').value.trim()
  const tb = document.getElementById('tokenB').value.trim()
  if (!ta || !tb) return showText(step1Status, '请填写两个账号的 Access Token')

  state.tokenA = ta; state.tokenB = tb

  showText(step1Status, '正在加载双方收藏数据...')

  const res = await apiFetch('/api/manage/compare', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ tokenA: ta, userA: 'Account A', tokenB: tb, userB: 'Account B' }),
  })
  if (!res) return showText(step1Status, "请求失败，请检查 token 是否有效")
  const data = await res.json().catch(() => null)
  if (!res.ok) return showError(step1Status, data, '加载收藏数据失败')

  state.differences = data.differences || []
  renderComparison(data)
  step1.classList.remove('active')
  step2.classList.add('active')
})

function renderComparison(data) {
  clear(step2Summary)
  const nameA = data?.userA?.name || 'Account A'
  const nameB = data?.userB?.name || 'Account B'
  const sameLen = (data?.same || []).length
  const diffLen = (data?.differences || []).length
  const onlyALen = (data?.onlyA || []).length
  const onlyBLen = (data?.onlyB || []).length

  // Summary cards
  ;[
    { key: 'userA', label: nameA },
    { key: 'userB', label: nameB },
  ].forEach(({ key, label }) => {
    const card = document.createElement('div'); card.className = 'summary-card'
    const s = data?.[key]
    if (s?.error) {
      card.style.border = '1px solid #e94560'
      card.append(textElement('div', '✗', 'count'))
      card.append(textElement('div', label, 'label'))
      card.append(textElement('div', s.error, 'muted'))
    } else {
      card.append(textElement('div', String(s?.total || '?'), 'count'))
      card.append(textElement('div', label, 'label'))
    }
    step2Summary.append(card)
  })

  // Stats bar
  const statsBar = document.createElement('div')
  statsBar.style.cssText = 'display:flex;gap:12px;flex-wrap:wrap;font-size:13px;margin-bottom:12px;'
  statsBar.innerHTML = `<span style="color:#4caf50;">相同: ${sameLen}</span> <span style="color:#e94560;">差异: ${diffLen}</span> <span>仅${nameA}: ${onlyALen}</span> <span>仅${nameB}: ${onlyBLen}</span>`
  step2Summary.append(statsBar)

  // Sync direction suggestion
  const dir = document.getElementById('sync-direction')
  const suggestAtoB = onlyALen > onlyBLen || (onlyALen === onlyBLen && (data?.userA?.total || 0) > (data?.userB?.total || 0))
  const aToB = `<option value="A->B"${suggestAtoB ? ' selected' : ''}>${nameA} → ${nameB}（${nameA} 覆盖 ${nameB}）</option>`
  const bToA = `<option value="B->A"${!suggestAtoB ? ' selected' : ''}>${nameB} → ${nameA}（${nameB} 覆盖 ${nameA}）</option>`
  dir.innerHTML = aToB + bToA
  if (suggestAtoB) {
    const hint = document.createElement('p')
    hint.className = 'muted'
    hint.style.cssText = 'font-size:12px;margin-top:4px;'
    hint.textContent = `已自动选择 ${nameA} → ${nameB}（${nameA} 条目更多，建议以此方向同步）`
    dir.parentNode.insertBefore(hint, dir.nextSibling)
  }

  // Filter dropdown
  var progressCount = (data.differences || []).filter(function(d) { return d.typeA === d.typeB && d.epStatusA !== d.epStatusB }).length
  var filterHtml = '<div style="margin-bottom:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;">'
  filterHtml += '<select id="compare-filter" style="padding:8px 12px;font-size:13px;">'
  filterHtml += '<option value="all">全部差异 & 独有 (' + (diffLen + onlyALen + onlyBLen) + ')</option>'
  if (diffLen) filterHtml += '<option value="diff">仅状态/评分/进度不同 (' + diffLen + ')</option>'
  if (onlyALen) filterHtml += '<option value="onlyA">仅 ' + nameA + ' 有 (' + onlyALen + ')</option>'
  if (onlyBLen) filterHtml += '<option value="onlyB">仅 ' + nameB + ' 有 (' + onlyBLen + ')</option>'
  if (sameLen) filterHtml += '<option value="same">相同条目 (' + sameLen + ')</option>'
  if (progressCount) filterHtml += '<option value="progress">状态相同但进度不同 (' + progressCount + ')</option>'
  filterHtml += '</select></div>'
  step2Diffs.innerHTML = filterHtml

  // Render filtered table
  var tableWrap = document.createElement('div')
  tableWrap.id = 'compare-table'
  step2Diffs.appendChild(tableWrap)

  function renderFilteredTable(filter) {
    var rows = []

    if (filter === 'all' || filter === 'diff') {
      ;(data.differences || []).forEach(function(d) {
        rows.push({ section: 'diff', name: d.name_cn || d.name, sid: d.subject_id,
          a: typeLabel(d.typeA) + ' | ' + d.epStatusA + '话 | ' + d.rateA + '分',
          b: typeLabel(d.typeB) + ' | ' + d.epStatusB + '话 | ' + d.rateB + '分',
          checkbox: true, color: (d.typeA !== d.typeB ? '#e94560' : (d.epStatusA !== d.epStatusB ? '#ff9800' : '')) })
      })
    }
    if (filter === 'all' || filter === 'onlyA') {
      ;(data.onlyA || []).forEach(function(d) {
        rows.push({ section: 'onlyA', name: d.name_cn || d.name, sid: d.subject_id,
          a: typeLabel(d.typeA) + ' | ' + d.epStatusA + '话 | ' + d.rateA + '分', b: '—', checkbox: false, color: '#a0a0b0' })
      })
    }
    if (filter === 'all' || filter === 'onlyB') {
      ;(data.onlyB || []).forEach(function(d) {
        rows.push({ section: 'onlyB', name: d.name_cn || d.name, sid: d.subject_id,
          a: '—', b: typeLabel(d.typeB) + ' | ' + d.epStatusB + '话 | ' + d.rateB + '分', checkbox: false, color: '#a0a0b0' })
      })
    }
    if (filter === 'same') {
      ;(data.same || []).forEach(function(s) {
        rows.push({ section: 'same', name: s.name_cn || s.name, sid: s.subject_id,
          a: s.type + ' | ' + s.ep + '/' + (s.total||'??'), b: s.type + ' | ' + s.ep + '/' + (s.total||'??'), checkbox: false, color: '#4caf50' })
      })
    }
    if (filter === 'progress') {
      ;(data.differences || []).forEach(function(d) {
        if (d.typeA === d.typeB && d.epStatusA !== d.epStatusB) {
          rows.push({ section: 'progress', name: d.name_cn || d.name, sid: d.subject_id,
            a: typeLabel(d.typeA) + ' | ' + d.epStatusA + '话 | ' + d.rateA + '分',
            b: typeLabel(d.typeB) + ' | ' + d.epStatusB + '话 | ' + d.rateB + '分',
            checkbox: true, color: '#ff9800' })
        }
      })
    }

    var h = '<table style="width:100%;border-collapse:collapse;font-size:13px;">'
    h += '<thead><tr style="background:#0f3460;color:#a0a0b0;">'
    h += '<th style="padding:8px;text-align:left;width:35%;">条目</th>'
    h += '<th style="padding:8px;text-align:center;width:30%;background:#1a2744;">' + nameA + '</th>'
    h += '<th style="padding:8px;text-align:center;width:30%;background:#1a2744;">' + nameB + '</th>'
    h += '<th style="padding:8px;text-align:center;width:5%;">✓</th></tr></thead><tbody>'
    rows.forEach(function(r) {
      var bg = r.color ? 'border-left:3px solid ' + r.color + ';' : ''
      h += '<tr style="border-bottom:1px solid #2a2a4a;' + bg + '">'
      h += '<td style="padding:8px;">' + r.name + '</td>'
      h += '<td style="padding:8px;text-align:center;background:#1a2744;">' + r.a + '</td>'
      h += '<td style="padding:8px;text-align:center;">' + r.b + '</td>'
      h += '<td style="padding:8px;text-align:center;">' + (r.checkbox ? '<input type="checkbox" checked data-id="' + r.sid + '">' : '') + '</td></tr>'
    })
    h += '</tbody></table>'
    tableWrap.innerHTML = h
  }

  document.getElementById('compare-filter').addEventListener('change', function(e) {
    renderFilteredTable(e.target.value)
  })

  renderFilteredTable('all')
}

function typeLabel(t) { return {1:'想看',2:'看过',3:'在看',4:'搁置',5:'抛弃',0:'—'}[t] || t }

// ── Sync ──
document.getElementById('partial-sync-toggle').addEventListener('click', () => {
  const toggle = document.getElementById('partial-sync-toggle')
  const start = document.getElementById('partial-sync-start')
  const cbs = step2Diffs.querySelectorAll('input[type=checkbox]')
  if (start.style.display === 'none') {
    start.style.display = ''; toggle.textContent = '取消选择'
    cbs.forEach(c => c.style.display = '')
  } else {
    start.style.display = 'none'; toggle.textContent = '按选中条目同步'
    cbs.forEach(c => c.style.display = 'none')
  }
})

document.getElementById('full-sync').addEventListener('click', () => doSync('full', []))
document.getElementById('partial-sync-start').addEventListener('click', () => {
  const ids = Array.from(step2Diffs.querySelectorAll('input[type=checkbox]:checked')).map(c => Number(c.dataset.id))
  if (!ids.length) return alert('请至少选中一个条目')
  doSync('partial', ids)
})

async function doSync(mode, subjectIds) {
  const direction = document.getElementById('sync-direction').value
  const fromUser = direction === 'A->B' ? 'Account A' : 'Account B'
  const toUser = direction === 'A->B' ? 'Account B' : 'Account A'
  const fromToken = direction === 'A->B' ? state.tokenA : state.tokenB
  const toToken = direction === 'A->B' ? state.tokenB : state.tokenA

  syncProgress.style.display = ''
  syncProgressFill.style.width = '0%'
  syncProgressText.textContent = '正在同步...'

  const res = await apiFetch('/api/manage/sync', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ tokenA: fromToken, from: fromUser, tokenB: toToken, to: toUser, mode, subject_ids: subjectIds }),
  })
  if (!res) return showText(syncProgressText, "请求失败")
  const results = await res.json().catch(() => null)
  if (!res.ok) return showError(syncProgressText, results, '同步失败')

  const ok = results.filter(r => r.status === 'ok').length
  const err = results.filter(r => r.status === 'error').length
  syncProgressFill.style.width = '100%'
  syncProgressText.textContent = `同步完成：${ok} 成功，${err} 失败`
}

document.getElementById('reset-button').addEventListener('click', () => { location.reload() })
document.querySelectorAll('[data-requires-secret]').forEach(el => el.disabled = true)
</script>
</body>
</html>
