<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BangumiTV - 多账户同步</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #1a1a2e; color: #e0e0e0; min-height: 100vh; display: flex; justify-content: center; padding: 40px 20px; }
    .container { max-width: 800px; width: 100%; }
    h1 { text-align: center; margin-bottom: 32px; color: #fff; }
    .step { background: #16213e; border-radius: 12px; padding: 24px; margin-bottom: 16px; display: none; }
    .step.active { display: block; }
    label { display: block; margin-bottom: 8px; color: #a0a0b0; }
    input[type="text"], input[type="password"] { width: 100%; padding: 12px; border: 1px solid #2a2a4a; border-radius: 8px; background: #0f3460; color: #fff; font-size: 16px; margin-bottom: 16px; }
    input[type="text"]:focus, input[type="password"]:focus { outline: none; border-color: #e94560; }
    button { padding: 12px 24px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; background: #e94560; color: #fff; margin-right: 8px; }
    button:disabled, input:disabled, select:disabled { opacity: 0.5; cursor: not-allowed; }
    button.secondary { background: #0f3460; }
    .diff-item { display: flex; align-items: flex-start; gap: 12px; padding: 12px; border-bottom: 1px solid #2a2a4a; }
    .diff-info { flex: 1; }
    .diff-info h3 { font-size: 14px; margin-bottom: 4px; }
    .diff-info p { font-size: 12px; color: #a0a0b0; }
    .progress { margin-top: 16px; }
    .progress-bar { height: 8px; background: #2a2a4a; border-radius: 4px; overflow: hidden; }
    .progress-fill { height: 100%; background: #e94560; transition: width 0.3s; }
    select { padding: 8px 12px; border-radius: 6px; background: #0f3460; color: #fff; border: 1px solid #2a2a4a; }
    .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .summary-card { background: #0f3460; border-radius: 8px; padding: 16px; text-align: center; }
    .summary-card .count { font-size: 28px; font-weight: bold; color: #e94560; }
    .summary-card .label { font-size: 12px; color: #a0a0b0; margin-top: 4px; }
    .panel { background: #16213e; border-radius: 12px; padding: 24px; margin-bottom: 24px; border: 1px solid #2a2a4a; }
    .muted { color: #a0a0b0; }
    .error-box { background: #2a1a1a; border: 1px solid #e94560; border-radius: 8px; padding: 12px; }
    .error-box strong { color: #e94560; display: block; margin-bottom: 8px; }
    .error-box p { color: #ffaaaa; }
    .status-ok { color: #4caf50; }
    .button-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .button-row button { margin-right: 0; }
    .token-row { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 16px; }
    .token-row input { flex: 1; min-width: 200px; margin-bottom: 0; }
  </style>
</head>
<body>
<div class="container">
  <h1>BangumiTV 多账户同步</h1>

  <div id="gate" class="panel" style="display:block;">
    <h2>管理密码</h2>
    <p id="gate-help" class="muted" style="margin-bottom:12px;">本管理页受密码保护，请输入 MANAGE_SECRET：</p>
    <input type="password" id="gate-input" placeholder="管理密码">
    <button id="gate-submit">进入</button>
  </div>

  <div class="panel">
    <h2>Cron 同步 Token（定时同步用）</h2>
    <p class="muted" style="margin-bottom:12px;">在 <a href="https://bgm.tv/dev/token" target="_blank" style="color:#e94560;">bgm.tv 开发者设置</a> 生成一个永久 access token，粘贴到下方保存。用于 cron 定时同步抓取收藏数据。</p>
    <div class="token-row">
      <input type="password" id="cron-token-input" placeholder="粘贴 bgm.tv Access Token" data-requires-secret="true">
      <button id="cron-token-save" data-requires-secret="true">保存</button>
      <button id="cron-token-clear" class="secondary" data-requires-secret="true">清除已存 token</button>
    </div>
    <div id="cron-status" class="muted"></div>
  </div>

  <div class="step active" id="step1">
    <h2>步骤 1: 输入 bgm.tv 用户名和 Access Token</h2>
    <p class="muted" style="margin-bottom:12px;">在 <a href="https://bgm.tv/dev/token" target="_blank" style="color:#e94560;">bgm.tv 开发者设置</a> 分别生成两个账号的 access token（永久有效），粘贴到下方。</p>

    <label>账号 A 用户名</label>
    <input type="text" id="userA" placeholder="输入 bgm.tv 用户名" data-requires-secret="true">
    <label>账号 A Access Token</label>
    <input type="password" id="tokenA" placeholder="粘贴账号 A 的 Access Token" data-requires-secret="true">

    <label>账号 B 用户名</label>
    <input type="text" id="userB" placeholder="输入 bgm.tv 用户名" data-requires-secret="true">
    <label>账号 B Access Token</label>
    <input type="password" id="tokenB" placeholder="粘贴账号 B 的 Access Token" data-requires-secret="true">

    <button id="start-compare" data-requires-secret="true">下一步：对比收藏</button>
    <div id="step1-status" class="muted" style="margin-top:12px;"></div>
  </div>

  <div class="step" id="step2">
    <h2>步骤 2: 对比结果 & 同步</h2>
    <div class="summary" id="step2-summary"></div>
    <div id="step2-diffs"></div>
    <div id="step2-sync" style="display:none;margin-top:20px;">
      <label>同步方向</label>
      <select id="sync-direction" data-requires-secret="true"></select>
      <div class="button-row" style="margin-top:12px;">
        <button id="full-sync" data-requires-secret="true">完整同步</button>
        <button id="partial-sync-toggle" class="secondary" data-requires-secret="true">按选中条目同步</button>
        <button id="partial-sync-start" data-requires-secret="true" style="display:none;">执行选中条目同步</button>
      </div>
      <div class="progress" id="sync-progress" style="display:none;">
        <div class="progress-bar"><div class="progress-fill" id="sync-progress-fill"></div></div>
        <p id="sync-progress-text" class="muted" style="margin-top:8px;"></p>
      </div>
    </div>
  </div>

  <div style="text-align:center;margin-top:24px;">
    <button id="reset-button" class="secondary">重新开始</button>
  </div>
</div>

<script>
const MANAGE_AUTH_FAILURE_MESSAGE = '管理 API 认证失败。请刷新页面后重新输入管理密码。'

let manageSecret = ''
let state = { userA: '', userB: '', tokenA: '', tokenB: '', differences: [] }

// ── DOM refs ──
const step1 = document.getElementById('step1')
const step2 = document.getElementById('step2')
const step1Status = document.getElementById('step1-status')
const step2Summary = document.getElementById('step2-summary')
const step2Diffs = document.getElementById('step2-diffs')
const syncProgress = document.getElementById('sync-progress')
const syncProgressFill = document.getElementById('sync-progress-fill')
const syncProgressText = document.getElementById('sync-progress-text')
const cronInput = document.getElementById('cron-token-input')
const cronStatus = document.getElementById('cron-status')

// ── Helpers ──
function clear(node) { while (node.firstChild) node.removeChild(node.firstChild) }
function textElement(tag, text, className) {
  const el = document.createElement(tag)
  el.textContent = text
  if (className) el.className = className
  return el
}
function showError(target, data, fallback) {
  const msg = data?.error?.message || fallback
  clear(target)
  target.appendChild(textElement('p', msg, 'error-box'))
}
function showText(target, text, className = 'muted') {
  clear(target)
  target.appendChild(textElement('p', text, className))
}
function showManageAuthFailure(target) {
  showText(target, MANAGE_AUTH_FAILURE_MESSAGE)
}
function handleManageDenied() {
  manageSecret = ''
  document.querySelectorAll('[data-requires-secret]').forEach(el => el.disabled = true)
}

async function apiFetch(url, opts = {}, { deferManageDenied } = {}) {
  const headers = new Headers(opts.headers || {})
  if (manageSecret) headers.set('X-Manage-Secret', manageSecret)
  try {
    const res = await fetch(url, { ...opts, headers })
    if (!deferManageDenied && (res.status === 401 || res.status === 503)) {
      document.getElementById('gate').style.display = 'block'
      handleManageDenied()
      return null
    }
    return res
  } catch { return null }
}

// ── Gate ──
const gateInput = document.getElementById('gate-input')
document.getElementById('gate-submit').addEventListener('click', () => {
  manageSecret = gateInput.value
  if (!manageSecret) return showText(document.getElementById('gate-help'), '请输入管理密码。')
  document.getElementById('gate').style.display = 'none'
  document.querySelectorAll('[data-requires-secret]').forEach(el => el.disabled = false)
})
gateInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('gate-submit').click()
})

// ── Cron token ──
document.getElementById('cron-token-save').addEventListener('click', async () => {
  const token = cronInput.value.trim()
  if (!token) return alert('请粘贴 token')
  if (!manageSecret) return document.getElementById('gate').style.display = 'block'
  showText(cronStatus, '正在保存...')
  const res = await apiFetch('/api/manage/cron-token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token }),
  })
  if (!res) return showManageAuthFailure(cronStatus)
  const data = await res.json().catch(() => null)
  if (!res.ok) return showError(cronStatus, data, 'Token 保存失败')
  showText(cronStatus, '✓ Cron token 已保存', 'status-ok')
  cronInput.value = ''
})

document.getElementById('cron-token-clear').addEventListener('click', async () => {
  if (!confirm('确认清除 cron 同步 token？清除后定时同步将无法执行。')) return
  const res = await apiFetch('/api/manage/cron-token', { method: 'DELETE' })
  if (!res) return showManageAuthFailure(cronStatus)
  showText(cronStatus, 'Token 已清除', 'muted')
})

// ── Compare ──
document.getElementById('start-compare').addEventListener('click', async () => {
  const ua = document.getElementById('userA').value.trim()
  const ub = document.getElementById('userB').value.trim()
  const ta = document.getElementById('tokenA').value.trim()
  const tb = document.getElementById('tokenB').value.trim()
  if (!ua || !ub || !ta || !tb) return showText(step1Status, '请填写所有字段')

  state.userA = ua; state.userB = ub
  state.tokenA = ta; state.tokenB = tb

  showText(step1Status, '正在加载双方收藏数据...')

  const res = await apiFetch('/api/manage/compare', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ tokenA: ta, userA: ua, tokenB: tb, userB: ub }),
  })
  if (!res) return showManageAuthFailure(step1Status)
  const data = await res.json().catch(() => null)
  if (!res.ok) return showError(step1Status, data, '加载收藏数据失败')

  state.differences = data.differences || []
  renderComparison(data)
  step1.classList.remove('active')
  step2.classList.add('active')
})

function renderComparison(data) {
  clear(step2Summary)
  ;[
    { key: 'userA', label: state.userA },
    { key: 'userB', label: state.userB },
  ].forEach(({ key, label }) => {
    const card = document.createElement('div')
    card.className = 'summary-card'
    const s = data?.[key]
    if (s?.error) {
      card.style.border = '1px solid #e94560'
      card.append(textElement('div', '✗', 'count'))
      card.append(textElement('div', label, 'label'))
      card.append(textElement('div', s.error, 'muted'))
    } else {
      card.append(textElement('div', String(s?.total || '?'), 'count'))
      card.append(textElement('div', label, 'label'))
    }
    step2Summary.append(card)
  })

  const dir = document.getElementById('sync-direction')
  dir.innerHTML = `<option value="A->B">${state.userA} → ${state.userB}（A 覆盖 B）</option>
                   <option value="B->A">${state.userB} → ${state.userA}（B 覆盖 A）</option>`

  clear(step2Diffs)
  if (state.differences.length === 0) {
    step2Diffs.append(textElement('p', '双方收藏完全一致，无需同步。', 'muted'))
    document.getElementById('step2-sync').style.display = 'none'
  } else {
    document.getElementById('step2-sync').style.display = ''
    const list = document.createElement('div')
    list.style.cssText = 'max-height:500px;overflow-y:auto;margin-top:12px;'
    state.differences.forEach(d => {
      const item = document.createElement('div')
      item.className = 'diff-item'
      item.innerHTML = `<div class="diff-info">
        <h3>${d.name_cn || d.name || '#' + d.subject_id}</h3>
        <p>A: ${diffStr(d.typeA, d.epStatusA, d.rateA)} | B: ${diffStr(d.typeB, d.epStatusB, d.rateB)}</p>
      </div>`
      const cb = document.createElement('input')
      cb.type = 'checkbox'; cb.checked = true; cb.dataset.id = d.subject_id
      cb.style.cssText = 'margin-top:4px;'
      if (document.getElementById('partial-sync-toggle').style.display === 'none') cb.style.display = 'none'
      item.prepend(cb)
      list.appendChild(item)
    })
    step2Diffs.appendChild(list)
  }
}

function diffStr(type, ep, rate) {
  const types = { 1: '想看', 2: '看过', 3: '在看', 4: '搁置', 5: '抛弃' }
  return `${types[type] || type} | ${ep} 话 | ${rate} 分`
}

// ── Sync ──
document.getElementById('partial-sync-toggle').addEventListener('click', () => {
  const toggle = document.getElementById('partial-sync-toggle')
  const start = document.getElementById('partial-sync-start')
  const cbs = step2Diffs.querySelectorAll('input[type=checkbox]')
  if (start.style.display === 'none') {
    start.style.display = ''; toggle.textContent = '取消选择'
    cbs.forEach(c => c.style.display = '')
  } else {
    start.style.display = 'none'; toggle.textContent = '按选中条目同步'
    cbs.forEach(c => c.style.display = 'none')
  }
})

document.getElementById('full-sync').addEventListener('click', () => doSync('full', []))
document.getElementById('partial-sync-start').addEventListener('click', () => {
  const ids = Array.from(step2Diffs.querySelectorAll('input[type=checkbox]:checked')).map(c => Number(c.dataset.id))
  if (!ids.length) return alert('请至少选中一个条目')
  doSync('partial', ids)
})

async function doSync(mode, subjectIds) {
  const direction = document.getElementById('sync-direction').value
  const fromUser = direction === 'A->B' ? state.userA : state.userB
  const toUser = direction === 'A->B' ? state.userB : state.userA
  const fromToken = direction === 'A->B' ? state.tokenA : state.tokenB
  const toToken = direction === 'A->B' ? state.tokenB : state.tokenA

  syncProgress.style.display = ''
  syncProgressFill.style.width = '0%'
  syncProgressText.textContent = '正在同步...'

  const res = await apiFetch('/api/manage/sync', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ tokenA: fromToken, from: fromUser, tokenB: toToken, to: toUser, mode, subject_ids: subjectIds }),
  })
  if (!res) return showManageAuthFailure(syncProgressText)
  const results = await res.json().catch(() => null)
  if (!res.ok) return showError(syncProgressText, results, '同步失败')

  const ok = results.filter(r => r.status === 'ok').length
  const err = results.filter(r => r.status === 'error').length
  syncProgressFill.style.width = '100%'
  syncProgressText.textContent = `同步完成：${ok} 成功，${err} 失败`
}

document.getElementById('reset-button').addEventListener('click', () => { location.reload() })
document.querySelectorAll('[data-requires-secret]').forEach(el => el.disabled = true)
</script>
</body>
</html>
