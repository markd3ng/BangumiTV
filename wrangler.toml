name = "bangumi-tv"
main = "workers/index.ts"
compatibility_date = "2026-06-17"
pages_build_output_dir = "public"

[triggers]
crons = ["0 */4 * * *"]

[vars]
SYNC_MODE = "merge"
NSFW_SHOW = "true"

[[kv_namespaces]]
binding = "BANGUMI_KV"
id = "bangumi-tv-kv"

[[r2_buckets]]
binding = "BANGUMI_R2"
bucket_name = "bangumi-tv-images"

# 允许将 HTML 作为文本模块导入（manage 页面模板）。
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true
